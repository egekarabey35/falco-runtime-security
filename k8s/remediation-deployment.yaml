apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-remediation
  namespace: security-monitoring
  labels:
    app: falco-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-remediation
  template:
    metadata:
      labels:
        app: falco-remediation
    spec:
      serviceAccountName: falco-remediation-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remediation
          image: falco-remediation:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "20m"
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: falco-remediation
  namespace: security-monitoring
spec:
  selector:
    app: falco-remediation
  ports:
    - port: 8080
      targetPort: http
      name: http
