apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-remediation
  namespace: security-monitoring
  labels:
    app: falco-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-remediation
  template:
    metadata:
      labels:
        app: falco-remediation
    spec:
      serviceAccountName: falco-remediation-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remediation
          # Immutable SHA256 digest pinning (supply chain tampering protection)
          image: ghcr.io/egekarabey35/falco-remediation@sha256:9f83a8b92b67d589d9e602264627bbf268153a5c2d3a393ff76c66cf17066d78
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FALCO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  # CRITICAL FIX: This secret is NO LONGER stored in Git.
                  # It must be provisioned externally via HashiCorp Vault or External Secrets Operator.
                  name: falco-webhook-secret
                  key: token
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "20m"
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: falco-remediation
  namespace: security-monitoring
spec:
  selector:
    app: falco-remediation
  ports:
    - port: 8080
      targetPort: http
      name: http
