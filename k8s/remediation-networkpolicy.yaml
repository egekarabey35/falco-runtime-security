apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falco-remediation-netpol
  namespace: security-monitoring
spec:
  podSelector:
    matchLabels:
      app: falco-remediation
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: falco
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # CRITICAL FIX: Allow DNS resolution (CoreDNS) for dynamic API endpoints (EKS/GKE compatibility)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # CRITICAL FIX: Broaden API access to standard private Service CIDRs to avoid hardcoding 10.96.0.1
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - protocol: TCP
          port: 443
