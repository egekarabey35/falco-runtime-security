name: Compliance as Code & Automated Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    steps:
      # CRITICAL FIX: Tum aksiyonlar immutable SHA digest'larina pinlendi.
      - name: Checkout Code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@b784a9e5954a6efcf5668b8ec80271701385474c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-format: json
          report-path: reports/gitleaks-report.json
        continue-on-error: true

      - name: Run Checkov IaC Compliance Scan
        uses: bridgecrewio/checkov-action@a4fd7c20c9f131a40de6d90040713b632fa5a73e # v12.2858.0
        with:
          config_file: policies/checkov/.checkov.yaml
          directory: infrastructure/prod
          output_format: json
          output_file_path: reports/results_json.json
          soft_fail: false
        continue-on-error: true

      # CRITICAL FIX: Supply Chain acigi kapatildi. Indirilen binary sha256sum ile dogrulaniyor.
      - name: Setup Conftest (with Checksum Verification)
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_checksums.txt
          grep "conftest_0.48.0_Linux_x86_64.tar.gz" conftest_0.48.0_checksums.txt | sha256sum -c -
          tar xzf conftest_0.48.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Meta-Test (Verify Negative Fixtures Fail)
        run: |
          if conftest test test-workloads/negative-fixtures/*.yaml -p policies/opa/pci_dss.rego > /dev/null 2>&1; then
            echo "[FATAL] K8s negative test passed unexpectedly!"
            exit 1
          fi
          if conftest test test-workloads/negative-fixtures/*.json -p policies/opa/pci_dss.rego > /dev/null 2>&1; then
            echo "[FATAL] Terraform negative test passed unexpectedly!"
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsComplianceRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d322d5737b34f40f0967389c9769 # v3.1.2
        
      - name: Generate Dynamic Terraform Plan
        run: |
          cd infrastructure/prod
          terraform init
          terraform plan -out=tfplan
          terraform show -json tfplan > tf-plan-raw.json
          cat tf-plan-raw.json | jq 'del(.variables, .configuration.root_module.variables)' > tf-plan.json
          rm tf-plan-raw.json

      - name: Run OPA Rego Verification on Prod Infrastructure
        run: |
          conftest test infrastructure/prod/*.yaml infrastructure/prod/*.json -p policies/opa/pci_dss.rego -o json > reports/opa-report.json || true

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.17.0
        with:
          image-ref: 'cgr.dev/chainguard/static@sha256:d8a29a4128f729fcc01a35a6039543940be66d863f6e8d24b61ff6cc7c132890'
          format: 'json'
          output: 'reports/trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@f677139bbe775c42670ba533f55d04222f03f7e6 # v5.0.0
        with:
          python-version: '3.11'

      - name: Compile Regulatory Evidence & Enforce Gate
        if: always()
        run: python scripts/generate-audit-pack.py

      - name: Install Cosign
        if: always()
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        
      - name: Sign Evidence with Sigstore (Keyless + TSA)
        if: always()
        run: |
          cosign sign-blob --yes \
            --tlog-upload=false \
            --timestamp-server-url=http://timestamp.digicert.com \
            --output-signature reports/AUDIT_EVIDENCE.md.sig \
            --output-certificate reports/AUDIT_EVIDENCE.md.crt \
            reports/AUDIT_EVIDENCE.md

      - name: Archive Audit Evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: regulatory-audit-evidence-pack
          path: |
            reports/AUDIT_EVIDENCE.md
            reports/AUDIT_EVIDENCE.md.sig
            reports/AUDIT_EVIDENCE.md.crt
