name: Compliance as Code & Automated Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@b784a9e5954a6efcf5668b8ec80271701385474c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-format: json
          report-path: reports/gitleaks-report.json
        continue-on-error: true

      - name: Run Checkov IaC Compliance Scan
        uses: bridgecrewio/checkov-action@v12.2858.0
        with:
          config_file: policies/checkov/.checkov.yaml
          directory: test-workloads # Sadece gercek workloadlar taranir
          output_format: json
          output_file_path: reports/results_json.json
          soft_fail: false
        continue-on-error: true

      - name: Setup Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.48.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin
          
      - name: Run OPA Rego Verification
        run: conftest test test-workloads/*.yaml -p policies/opa/pci_dss.rego -o json > reports/opa-report.json || true

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.17.0
        with:
          scan-type: 'config'
          scan-ref: 'test-workloads'
          format: 'json'
          output: 'reports/trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Regulatory Evidence
        if: always()
        run: python scripts/generate-audit-pack.py

      # Claude'un SHA uyarisi duzeltildi (v3.5.0 yerine digest)
      - name: Install Cosign
        if: always()
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        
      # Claude'un Fintech veri sizintisi uyarisi duzeltildi (--tlog-upload=false eklendi)
      - name: Sign Evidence with Sigstore (Keyless)
        if: always()
        run: |
          cosign sign-blob --yes \
            --tlog-upload=false \
            --output-signature reports/AUDIT_EVIDENCE.md.sig \
            --output-certificate reports/AUDIT_EVIDENCE.md.crt \
            reports/AUDIT_EVIDENCE.md

      - name: Archive Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-audit-evidence-pack
          path: |
            reports/AUDIT_EVIDENCE.md
            reports/AUDIT_EVIDENCE.md.sig
            reports/AUDIT_EVIDENCE.md.crt
