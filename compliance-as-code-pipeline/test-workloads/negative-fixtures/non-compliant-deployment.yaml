apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-workload
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure
  template:
    metadata:
      labels:
        app: insecure
    spec:
      containers:
        - name: app
          # Digest pinning: "latest" kaldirildi, supply chain guvenligi saglandi.
          image: nginx@sha256:0a399eb16751829e1af26fea27b20c3ec28d7ab1fb72182879dcae1cca21206a
          securityContext:
            runAsNonRoot: false
            privileged: true
            allowPrivilegeEscalation: true
